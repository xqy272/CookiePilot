name: Validate Cookie Pilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify generated release files match source
        run: git diff --exit-code -- dist extension/pilot.bundle.js extension/manifest.json CookiePilot.user.js 开始使用.html
