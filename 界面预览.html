<!doctype html><html lang="zh-CN" data-cookie-pilot-demo="true"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Pilot · 交互演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#161b18;color:#e3ebe4;font:14px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}#topBar{padding:8px 16px;border-bottom:1px solid #344336;display:flex;align-items:center;gap:20px;height:48px}#topBar span{color:#9eafa1;font-size:12px}.stage{max-width:1100px;margin:80px auto;padding:0 30px}h1{font-size:44px;font-weight:500;line-height:1.35;letter-spacing:-1px}p{color:#9daf9f;max-width:650px}button,select{font:inherit;padding:8px 14px;border:1px solid #536c57;background:#293a2d;color:#d8e9db;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap}#result{white-space:pre-wrap;font:12px/1.8 monospace;max-width:900px}#support{padding:20px;border:1px dashed #8f7c53;margin:25px 0;max-width:300px;color:#ab9b77}.tag{color:#bdcea9;font-size:12px}a{color:#bdd8bf}.small{font-size:12px}
</style><div id="topBar"><span>COOKIE CLICKER / 独立模拟环境</span><span>不会读取真实存档</span></div><main class="stage"><h1>Cookie Pilot 工作台</h1><p>点击顶栏 Pilot 打开实际辅助界面。此页使用明确标记的模拟数据，可以试用所有配置、查看各模块和执行测试；不连接你的游戏存档。</p><div class="actions"><button id="demo-open">打开工作台</button><button id="demo-golden">出现金饼干</button><button id="demo-buff">触发点击狂热</button><select id="demo-stage" aria-label="模拟进度"><option value="late">后期 / 小游戏全部解锁</option><option value="early">前期 / 未解锁小游戏</option></select><button id="demo-tests">运行交互测试</button></div><p class="small">测试会临时改变这里的模拟资源与助手设置。正式游戏与此页的本地存储按站点隔离。</p><div id="support">模拟广告区域</div><pre id="result" role="status"></pre><p><a href="开始使用.html">安装与更新说明 →</a></p></main><script src="tests/fixture.js"></script><script>window.Game=makePilotFixture();document.getElementById('demo-stage').onchange=e=>{Game=makePilotFixture(e.target.value);};document.getElementById('demo-open').onclick=()=>CookiePilot2.show();document.getElementById('demo-golden').onclick=()=>Game.spawn();document.getElementById('demo-buff').onclick=()=>{Game.buffs['Click frenzy']={name:'Click frenzy',multClick:777,time:390};};setInterval(()=>{if(!Game.demoFreeze)Game.Earn(Game.cookiesPs/10);for(const[k,b]of Object.entries(Game.buffs)){b.time-=3;if(b.time<=0)delete Game.buffs[k];}const m=Game.Objects.Bank.minigame;m.tickT+=3;if(m.tickT>=1800){m.tickT=0;for(const q of m.goodsById)q.last=0;}},100);</script><script src="extension/pilot.bundle.js"></script><script src="tests/browser-tests.js"></script></html>
